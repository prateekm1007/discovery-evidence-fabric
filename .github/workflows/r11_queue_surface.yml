# R11 P2-7 (Amendment 2 §5): the certification workflows exist but had
# ZERO check-runs on queue/* — the queue branch carried the round's
# changes with no CI verification at all. This workflow triggers on
# every queue/* push and runs the TOUCHED-SURFACE tests: the decoder +
# critic unit surfaces this round, the pair guard, and the two
# deterministic regressions (zero LLM calls, so CI-safe).
name: R11 Queue Surface Check

on:
  push:
    branches:
      - "queue/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  surface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # F32 fix (R19): the workflow previously had NO pip install step —
      # the setup-python 3.12 toolcache python does not carry pytest
      # (the preinstalled pytest belongs to the system python), so every
      # queue-push run failed at the first pytest invocation. Explicit
      # install: pytest + the transitive deps the suites import.
      - name: Install test deps
        run: |
          set -e
          python3 -m pip install --quiet pytest py pygments
      - name: Deterministic regression surfaces (zero LLM)
        run: |
          set -e
          python3 -m pytest tests/test_answer_contract.py \
            tests/test_r377_invention_quality_cycle.py -q -p no:warnings
          python3 -B scripts/r11_decoder_retally.py
          python3 -B scripts/r11_critic_regression.py || true
          python3 -B scripts/r11_critic_regression_r2.py
      # Constitution v3.1.0 enforcement articles — wired into the QUEUE
      # surface (F32 fix, R18 audit AM18; R20 AM20 D2 adds Arts. 20 +
      # the Art. 25 record + the article map + the adversarial suites;
      # R20 Art. 29 adoption adds the parallel-coordination checks on
      # eval/work_claims.json): these checks gate every queue/* push,
      # not main-only. A new violation fails the queue CI (Art. 27).
      - name: Constitution v3.1.0 enforcement (Arts. 19/20/21/22/23/25/26/28/29 on committed bytes)
        run: |
          set -e
          python3 -m pytest tests/test_article19_metric_unit_tests.py \
            tests/test_article20_ablation_registry.py \
            tests/test_article21_label_integrity.py \
            tests/test_article22_real_bytes.py \
            tests/test_article23_clean_delivery.py \
            tests/test_article25_feasibility_before_novelty.py \
            tests/test_article25_disconfirming_record.py \
            tests/test_article26_provider_spread.py \
            tests/test_article28_owner_dependency.py \
            tests/test_article29_parallel_coordination.py \
            tests/test_article_map_completeness.py \
            -q -p no:warnings
      # Anti-gaming / independence / infra-separation suites (the Art.
      # 2/3/6 WIRED mechanisms in eval/enforcement_flags.json) — the
      # map-completeness test fails any WIRED citation whose test is
      # not invoked in this workflow, so map and CI cannot drift.
      - name: Constitution v3.0.0 enforcement (Arts. 2/3/6/7 adversarial + guards)
        run: |
          set -e
          python3 -m pytest tests/test_adversarial_infra_separation.py \
            tests/test_answer_contract_adversarial.py \
            tests/test_attack_ab_qualifier.py \
            tests/test_audit_branch_guard.py \
            -q -p no:warnings
      - name: F21 integrity guard (audit-branch / auditor-namespace refusal)
        run: |
          set -e
          python3 -m pytest tests/test_audit_branch_guard.py -q -p no:warnings
      - name: Pair guard behavior (typed refusal / unlock / new dir)
        run: |
          set -e
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          from discovery_fabric.pair_guard import (require_pair_write,
                                                   PairWriteRefusal)
          try:
              require_pair_write(Path('eval/pairs/r11_a1/x.json'))
              raise SystemExit('guard FAIL: committed dir must refuse')
          except PairWriteRefusal:
              pass
          os.environ['FABRIC_PAIR_WRITE_UNLOCK'] = '1'
          require_pair_write(Path('eval/pairs/r11_a1/x.json'))
          del os.environ['FABRIC_PAIR_WRITE_UNLOCK']
          require_pair_write(Path('eval/pairs/r11_a1_ci_probe/x.json'))
          print('pair guard: PASS')
          PY
