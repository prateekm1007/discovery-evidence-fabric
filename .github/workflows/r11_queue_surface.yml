# R11 P2-7 (Amendment 2 §5): the certification workflows exist but had
# ZERO check-runs on queue/* — the queue branch carried the round's
# changes with no CI verification at all. This workflow triggers on
# every queue/* push and runs the TOUCHED-SURFACE tests: the decoder +
# critic unit surfaces this round, the pair guard, and the two
# deterministic regressions (zero LLM calls, so CI-safe).
name: R11 Queue Surface Check

on:
  push:
    branches:
      - "queue/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  surface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # F32 fix (R19): the workflow previously had NO pip install step —
      # the setup-python 3.12 toolcache python does not carry pytest
      # (the preinstalled pytest belongs to the system python), so every
      # queue-push run failed at the first pytest invocation. Explicit
      # install: pytest + the transitive deps the suites import.
      - name: Install test deps
        run: |
          set -e
          # R50 (c-0066 lineage): pint joins the install list —
          # tests/test_physics_checks.py imports pint through
          # discovery_fabric.engine.physics_checks (the P1.1 computed-
          # physics slice); without it the step-2 collection dies with
          # exit 2 BEFORE any test runs (the 6d6c4de70 remote failure,
          # diagnosed by the same symptom locally).
          python3 -m pip install --quiet pytest py pygments pint
      - name: Deterministic regression surfaces (zero LLM)
        run: |
          set -e
          # R40b (c-0053, F53-class 4th instance): the guard-activation
          # suite existed since the R40 build but was wired into NO
          # workflow — the activation-checker itself gated nothing. It
          # now runs here. The hooksPath setup step is part of the fix:
          # a fresh CI checkout has no core.hooksPath configured (it is
          # clone-local state), so the step activates the recipe AND
          # makes the suite's first assertion (hooksPath == .githooks)
          # meaningful in CI instead of locally-only.
          git config core.hooksPath .githooks
          python3 -m pytest tests/test_answer_contract.py \
            tests/test_r377_invention_quality_cycle.py \
            tests/test_seal_anchor.py \
            tests/test_r38_v6_anchor_exact.py \
            tests/test_r38_probe_pins.py \
            tests/test_r30_am29_binds.py \
            tests/test_guard_activation.py -q -p no:warnings
          python3 -B scripts/r11_decoder_retally.py
          python3 -B scripts/r11_critic_regression.py || true
          python3 -B scripts/r11_critic_regression_r2.py
      # Constitution v3.1.0 enforcement articles — wired into the QUEUE
      # surface (F32 fix, R18 audit AM18; R20 AM20 D2 adds Arts. 20 +
      # the Art. 25 record + the article map + the adversarial suites;
      # R20 Art. 29 adoption adds the parallel-coordination checks on
      # eval/work_claims.json; R24 AM24 D4 adds the Art. 27 capability-
      # budget ledger test — the last PARTIAL map entry wired): these
      # checks gate every queue/* push, not main-only. A new violation
      # fails the queue CI (Art. 27).
      - name: Constitution v3.1.0 enforcement (Arts. 19/20/21/22/23/25/26/27/28/29 + the 9 former-PROCESS articles on committed bytes)
        run: |
          set -e
          # F56 fix (AM39 D1, claim c-0056): the R41 guard suites join
          # the zero-LLM block — the D2 remote-green rule and the D3
          # bind negative controls now GATE every queue push (the 7th
          # exists-but-does-not-gate instance closes by wiring). The
          # comment sits OUTSIDE the pytest continuation chain: a '#'
          # after a line-continuation truncates the command (the
          # fd28fecb6 push red-gated exactly this — exit 126 trying
          # to execute a test file as a command).
          # R43 (claim c-0060): tests/test_v8_generation_binds.py joins
          # the same block ON THE SAME RULE — the V8 generation-binds
          # acceptance suite (the R42 verdict D1/D2/D5) gates every
          # queue push the moment it exists; the 9th instance never
          # opens.
          python3 -m pytest tests/test_article19_metric_unit_tests.py \
            tests/test_article20_ablation_registry.py \
            tests/test_article21_label_integrity.py \
            tests/test_article22_real_bytes.py \
            tests/test_article23_clean_delivery.py \
            tests/test_article25_feasibility_before_novelty.py \
            tests/test_article25_disconfirming_record.py \
            tests/test_article26_provider_spread.py \
            tests/test_article27_capability_budget.py \
            tests/test_article28_owner_dependency.py \
            tests/test_article29_parallel_coordination.py \
            tests/test_article_process_wiring.py \
            tests/test_article_map_completeness.py \
            tests/test_remote_ci_rule.py \
            tests/test_v77_bind_controls.py \
            tests/test_v8_generation_binds.py \
            tests/test_physics_checks.py \
            tests/test_candidate_schema.py \
            tests/test_engine_route.py \
            tests/test_novelty_gate_engine.py \
            tests/test_triz_data.py \
            tests/test_physics_checks_r54.py \
            tests/test_all_refs_secret_scan.py \
            -q -p no:warnings
      # F64 remedy (R53, c-0071): the P1.4 labelled regression runs IN
      # CI from committed bytes — the gate verdict must be PASS 0/0/0
      # or the push reds. The driver is zero-LLM (deterministic,
      # content-only candidate hashes after the derived_at/hash-seed
      # fixes), so CI is the reproducibility proof.
      - name: P1.4 labelled regression through the integrated engine route (F64)
        run: |
          set -e
          python3 scripts/r52_labelled_regression.py | tee /tmp/r53_regression.log
          grep -q '"verdict":"PASS 0/0/0"' /tmp/r53_regression.log \
            || grep -q '"verdict": "PASS 0/0/0"' /tmp/r53_regression.log
      # The P1 >=80% numeric-claims-unit-checked leg (R54, c-0072):
      # every numeric-direction claim on the labelled DEV rows must
      # carry an applicable registry relation that RUNS with a pint
      # value on its committed reference scenario. Below 0.80 the
      # push reds; eval/r54_p1_unit_checked.json is the CI-checkable
      # evidence (measured fraction 1.0 at c-0072 finalize).
      - name: P1 unit-checked measurement on labelled DEV outputs (c-0072)
        run: |
          set -e
          python3 scripts/r54_p1_unit_checked_measurement.py | tee /tmp/r54_p1.log
          grep -q 'P1_UNIT_CHECKED_PASS' /tmp/r54_p1.log
      # Anti-gaming / independence / infra-separation suites (the Art.
      # 2/3/6 WIRED mechanisms in eval/enforcement_flags.json) — the
      # map-completeness test fails any WIRED citation whose test is
      # not invoked in this workflow, so map and CI cannot drift.
      - name: Constitution v3.0.0 enforcement (Arts. 2/3/6/7 adversarial + guards)
        run: |
          set -e
          python3 -m pytest tests/test_adversarial_infra_separation.py \
            tests/test_answer_contract_adversarial.py \
            tests/test_attack_ab_qualifier.py \
            tests/test_audit_branch_guard.py \
            -q -p no:warnings
      - name: F21 integrity guard (audit-branch / auditor-namespace refusal)
        run: |
          set -e
          python3 -m pytest tests/test_audit_branch_guard.py -q -p no:warnings
      - name: Pair guard behavior (typed refusal / unlock / new dir)
        run: |
          set -e
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          from discovery_fabric.pair_guard import (require_pair_write,
                                                   PairWriteRefusal)
          try:
              require_pair_write(Path('eval/pairs/r11_a1/x.json'))
              raise SystemExit('guard FAIL: committed dir must refuse')
          except PairWriteRefusal:
              pass
          os.environ['FABRIC_PAIR_WRITE_UNLOCK'] = '1'
          require_pair_write(Path('eval/pairs/r11_a1/x.json'))
          del os.environ['FABRIC_PAIR_WRITE_UNLOCK']
          require_pair_write(Path('eval/pairs/r11_a1_ci_probe/x.json'))
          print('pair guard: PASS')
          PY
      # AM42 D8 (claim c-0067, ROADMAP P0.3): the all-refs secret-scan
      # GATE on every queue push. Tips mode scans every remote branch
      # tip tree (git grep, C-speed) against the committed
      # fingerprint-keyed baseline (eval/secret_scan_baseline.json) —
      # 0 unbaselined findings or the push REDS. The full-history
      # pickaxe pass (mode=all) is the committed enumeration report
      # (eval/r50_all_refs_scan_report.json), re-run per round; the
      # tips gate + detect-secrets pre-commit + the report are three
      # independent layers on one acceptance.
      - name: All-refs secret-scan gate (D8 — tips surface, baseline gate)
        run: |
          set -e
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune --quiet
          python3 scripts/r45_all_refs_secret_scan.py --mode tips
