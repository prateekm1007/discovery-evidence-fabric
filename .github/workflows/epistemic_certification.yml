# Epistemic Firewall Certification — R399 W4 CI COST TIERING
#
# Per CEO v26 audit directive 4:
#   "Add a GitHub Actions workflow that runs the detached certification on
#    the exact commit and exposes the result as a GitHub status/check."
#
# R399 W4 (CEO directive, measured): the certification fired a full
# 14-gate run on EVERY push — including worklog-only commits (measured:
# 20% of the last 200 commits are docs-only; 663 total runs). Tiers
# now (certification SUBSTANCE never reduced — only its triggers):
#
#   LIGHTWEIGHT  markdown/evidence-only pushes — the lightweight
#                workflow (epistemic_lightweight.yml): secret scan +
#                constitution presence + registry JSON validity.
#   FULL         engine/workflow/connector/ontology/test/release-relevant
#                code paths — THIS workflow, the unchanged 14-gate
#                detached certification + capsule.
#   FAST         other code-path changes (scripts/, UI, docs mix) — this
#                workflow's fast-check job: secret scan + the frozen
#                benchmark + the release-gate suites (the epistemic
#                core; engine changes always get FULL anyway).
#   RELEASE      workflow_dispatch (commit_sha input) — the complete
#                certification; the EXTERNAL ACCEPTANCE protocol (P1-P7
#                probes against the deployed host) remains operator-side
#                by design (CI is not acceptance — R396 Phase C).
#
# The workflow is DETERMINISTIC: same commit → same capsule hash.
# The CEO can independently reproduce the certification by:
#   1. Cloning the repo at the exact commit
#   2. Running: python -m epistemic_integrity.post_scrub_certification_capsule
#   3. Comparing the capsule_hash to the one uploaded as an artifact
#
# The workflow also creates a GitHub status check on the commit, so the
# CEO can query the GitHub combined-status endpoint to verify that an
# external CI system emitted the certification result.

name: Epistemic Certification

on:
  push:
    branches: [main]
    # R399 W4 LIGHTWEIGHT tier: a push whose EVERY changed file is
    # docs/evidence (markdown, worklog, R-round records) does not run
    # the full certification — the lightweight workflow handles it.
    # Any code-path file in the push re-enables this workflow (GitHub
    # paths-ignore semantics: skip only when ALL files match).
    paths-ignore:
      - "worklog.md"
      - "**.md"
      - "R3[0-9][0-9]/**"
      - "ARCHIVE_MANIFEST.json"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to certify (defaults to HEAD)'
        required: false
        default: ''

permissions:
  contents: read
  statuses: write
  actions: write

jobs:
  # R399 W4 FAST vs FULL split: engine-relevant paths get the unchanged
  # full certification; other code paths (scripts/UI) get the
  # fast-check job. Certification substance is never reduced — the
  # full path runs for exactly the paths it guards.
  classify:
    name: Classify changed paths (R399 W4 tier)
    runs-on: ubuntu-latest
    outputs:
      engine_paths: ${{ steps.filter.outputs.engine_paths }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.commit_sha || github.ref }}
      - name: Path filter (engine-relevant vs other code)
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            engine_paths:
              - 'discovery_fabric/**'
              - 'toscanini/**'
              - 'orchestrator/**'
              - 'epistemic_integrity/**'
              - 'premium_package_factory/**'
              - 'mechanisms/**'
              - 'quarantine/**'
              - 'tests/**'
              - '.github/workflows/**'
              - 'EPISTEMIC_CONSTITUTION.md'
              - 'requirements.txt'
              - 'pyproject.toml'
              - 'ENGINE_RELEASE_REGISTRY.json'
              - 'Dockerfile'
              - '.dockerignore'

  certify:
    name: Run 14-Gate Detached Certification
    needs: classify
    if: ${{ needs.classify.outputs.engine_paths == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for credential scan and artifact audit
          ref: ${{ github.event.inputs.commit_sha || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install git-filter-repo
          # R401-WC2 (CEO directive 6): the canonical CI environment
          # must have the ENGINE RUNTIME dependencies installed —
          # cadquery/OCP included. "CAD actually executable in the
          # canonical CI/runtime environment" is proven by the next
          # two steps, not asserted.
          pip install -r requirements.txt
          pip install pytest

      - name: CAD executability proof (build + validate + export)
        run: |
          python - <<'PY'
          import cadquery as cq
          import tempfile, pathlib
          # A REAL parametric build through the OCCT kernel (the same
          # kernel class the engine's cad_pipeline drives): construct,
          # boolean-cut, export STEP and STL, verify real bytes.
          part = (cq.Workplane("XY").circle(2.0).extrude(10.0)
                  .faces(">Z").workplane().circle(0.8).cutBlind(-2.0))
          out = pathlib.Path(tempfile.mkdtemp())
          step, stl = out / "probe.step", out / "probe.stl"
          cq.exporters.export(part, str(step))
          cq.exporters.export(part, str(stl))
          sz_step, sz_stl = step.stat().st_size, stl.stat().st_size
          assert sz_step > 1000, f"STEP export too small: {sz_step}"
          assert sz_stl > 100, f"STL export too small: {sz_stl}"
          bb = part.val().BoundingBox()
          assert abs(bb.xlen - 4.0) < 1e-2, bb.xlen
          print(f"CAD_EXECUTABLE: cadquery {cq.__version__} — build+cut+"
                f"export OK (STEP {sz_step}B, STL {sz_stl}B, bbox "
                f"{bb.xlen:.4f}x{bb.ylen:.4f}x{bb.zlen:.4f})")
          PY

      - name: CAD kernel suite (hermetic)
        run: |
          # test_r380_cad_pipeline.py is the hermetic CAD kernel suite
          # (proven in CI: 46/46 on d806e98d's failed run — the failure
          # was ONLY test_e21_series.py, which reads the GITIGNORED
          # artifacts/benchmark/generated/runs/ rehearsal outputs whose
          # regeneration (corpus_runner) requires the LLM transport —
          # not CI-hermetic; e21 stays a local suite).
          python -m pytest tests/test_r380_cad_pipeline.py -q

      - name: Webapp build check (R401-WC2)
        run: |
          # The deploy of 6ffdbbb5 failed at the Docker webapp stage on
          # a TS error (RunNarrative.tsx cast) shipped at R397 — no CI
          # step built the webapp, so nothing caught it until Render.
          # The Dockerfile's verify-export.mjs assertion works (the
          # deploy failed LOUDLY, by design) — this step moves the
          # same check earlier: build here, fail here.
          set -e
          cd TOSCANINI_UI/webapp
          npm ci --no-audit --no-fund
          NEXT_OUTPUT=export npm run build
          node verify-export.mjs

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Verify clean worktree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: Worktree is not clean"
            git status
            exit 1
          fi
          echo "✅ Worktree clean"

      - name: Run P0-2 Post-Scrub Evidence Revalidation
        run: |
          python -m epistemic_integrity.post_scrub_evidence_revalidation
        continue-on-error: true

      - name: Run P0-3 Historical Artifact Audit
        run: |
          python -m epistemic_integrity.historical_artifact_audit
        continue-on-error: true

      - name: Run P0-4 Credential Audit Split
        run: |
          python -m epistemic_integrity.credential_audit_split
        continue-on-error: true

      - name: Run P0-5 Authorization Binding
        run: |
          python -m epistemic_integrity.attestation_binding
        continue-on-error: true

      - name: Run full 14-gate certification (G1-G9 + G10-G14)
        run: |
          python -m epistemic_integrity.research_authorization_gate --in-place
        continue-on-error: true

      - name: Build Deterministic Certification Capsule
        id: capsule
        run: |
          set +e  # Don't exit on grep failure
          python -m epistemic_integrity.post_scrub_certification_capsule --no-gate > capsule_output.txt 2>&1
          EXIT_CODE=$?
          cat capsule_output.txt
          echo "Capsule exit code: $EXIT_CODE"
          # Extract capsule hash (grep returns 1 if no match, which is fine with set +e)
          CAPSULE_HASH=$(grep "Capsule hash:" capsule_output.txt | awk '{print $NF}' || echo "NOT_FOUND")
          echo "capsule_hash=$CAPSULE_HASH" >> $GITHUB_OUTPUT
          # Extract authorization
          if grep -q "AUTHORIZED_TO_RESUME_UNDER_POST_SCRUB_EPISTEMIC_STATE" capsule_output.txt; then
            echo "authorization=GREEN" >> $GITHUB_OUTPUT
          else
            echo "authorization=RED" >> $GITHUB_OUTPUT
          fi
          # Extract certified commit
          CERTIFIED_COMMIT=$(grep "Certified commit:" capsule_output.txt | awk '{print $NF}' || echo "${{ github.sha }}")
          echo "certified_commit=$CERTIFIED_COMMIT" >> $GITHUB_OUTPUT
          # Exit with the capsule's exit code
          exit $EXIT_CODE

      - name: Copy capsule to workspace
        run: |
          cp /tmp/epistemic_certification_output/post_scrub_certification_capsule.json .
          cp /tmp/epistemic_certification_output/post_scrub_evidence_revalidation_capsule.json .
          cp /tmp/epistemic_certification_output/historical_artifact_audit_report.json .
          cp /tmp/epistemic_certification_output/credential_audit_split_report.json .
          cp /tmp/epistemic_certification_output/authorization_binding.json .

      - name: Upload certification capsule as artifact
        uses: actions/upload-artifact@v4
        with:
          name: epistemic-certification-capsule-${{ github.sha }}
          path: |
            post_scrub_certification_capsule.json
            post_scrub_evidence_revalidation_capsule.json
            historical_artifact_audit_report.json
            credential_audit_split_report.json
            authorization_binding.json
            capsule_output.txt
          retention-days: 90

      - name: Create GitHub status check on commit
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ steps.capsule.outputs.authorization }}' === 'GREEN' ? 'success' : 'failure';
            const target_url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const description = `Capsule ${{ steps.capsule.outputs.capsule_hash }}`.substring(0, 140);
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ steps.capsule.outputs.certified_commit || github.sha }}',
              state: state,
              target_url: target_url,
              description: description,
              context: 'Epistemic Certification (14 gates)'
            });

      - name: Fail if authorization is not GREEN
        if: steps.capsule.outputs.authorization != 'GREEN'
        run: |
          echo "❌ Certification FAILED — authorization is ${{ steps.capsule.outputs.authorization }}"
          exit 1

      - name: Summary
        if: always()
        run: |
          echo "## Epistemic Certification Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ steps.capsule.outputs.certified_commit }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Authorization:** ${{ steps.capsule.outputs.authorization }}" >> $GITHUB_STEP_SUMMARY
          echo "**Capsule hash:** \`${{ steps.capsule.outputs.capsule_hash }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Authorization Semantics" >> $GITHUB_STEP_SUMMARY
          echo "🟢 **AUTHORIZED_TO_RESUME_UNDER_POST_SCRUB_EPISTEMIC_STATE**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This does NOT mean ALL_HISTORICAL_EVIDENCE_PRESERVED_EXACTLY." >> $GITHUB_STEP_SUMMARY
          echo "Pre-scrub byte-level equivalence is unproven due to filter-repo GC." >> $GITHUB_STEP_SUMMARY
          echo "See HISTORICAL_PROVENANCE_LIMITATION.json for details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Independent Reproduction" >> $GITHUB_STEP_SUMMARY
          echo "To independently reproduce this certification:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "git clone https://github.com/${{ github.repository }}.git" >> $GITHUB_STEP_SUMMARY
          echo "cd discovery-evidence-fabric" >> $GITHUB_STEP_SUMMARY
          echo "git checkout ${{ steps.capsule.outputs.certified_commit }}" >> $GITHUB_STEP_SUMMARY
          echo "python -m epistemic_integrity.post_scrub_certification_capsule" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Compare the capsule_hash to: \`${{ steps.capsule.outputs.capsule_hash }}\`" >> $GITHUB_STEP_SUMMARY

  # R399 W4 FAST tier: non-engine code-path pushes (scripts/, UI).
  # The epistemic core still runs (the frozen benchmark + the
  # release-gate suites + the secret scan); the 14-gate detached
  # certification is reserved for engine-relevant paths — which is
  # exactly what it certifies. A fast-check pass is NOT a
  # certification claim (Art. XXVI: the check name says so).
  fast-check:
    name: Fast check (non-engine code path, R399 W4)
    needs: classify
    if: ${{ needs.classify.outputs.engine_paths == 'false' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Secret scan (changed files)
        run: |
          python - <<'PY'
          import re, subprocess
          base = subprocess.run(['git','merge-base','HEAD','origin/main~1'],
                                capture_output=True, text=True).stdout.strip() or 'HEAD~1'
          diff = subprocess.run(['git','diff','--name-only', base, 'HEAD'],
                                capture_output=True, text=True).stdout
          patterns = {
              'github_pat': r'gh[pousr]_[A-Za-z0-9]{20,}',
              'nvidia': r'nvapi-[A-Za-z0-9]{20,}',
              'openrouter': r'sk-or-[A-Za-z0-9-]{20,}',
              'aws': r'AKIA[0-9A-Z]{16}',
              'bearer': r'Bearer\s+[A-Za-z0-9._-]{24,}',
          }
          hits = []
          for f in diff.splitlines():
              try:
                  text = open(f, errors='replace').read()
              except OSError:
                  continue
              for name, pat in patterns.items():
                  if re.search(pat, text):
                      hits.append(f'{f}: {name}')
          if hits:
              print('SECRET SCAN FAIL:'); [print(' ', h) for h in hits]
              raise SystemExit(1)
          print('secret scan: CLEAN')
          PY
      - name: Frozen benchmark + release-gate suites (the epistemic core)
        run: |
          python -m pytest tests/test_r394_benchmark.py tests/test_r396_release_gate.py \
            tests/test_r397_physics_stage.py tests/test_r399_gates.py \
            tests/test_r399_routing_states.py -q
      - name: CAD executability proof + kernel suite (R401-WC2)
        run: |
          python - <<'PY'
          import cadquery as cq
          import tempfile, pathlib
          part = (cq.Workplane("XY").circle(2.0).extrude(10.0)
                  .faces(">Z").workplane().circle(0.8).cutBlind(-2.0))
          out = pathlib.Path(tempfile.mkdtemp())
          step, stl = out / "probe.step", out / "probe.stl"
          cq.exporters.export(part, str(step))
          cq.exporters.export(part, str(stl))
          assert step.stat().st_size > 1000
          assert stl.stat().st_size > 100
          print(f"CAD_EXECUTABLE: cadquery {cq.__version__}")
          PY
          # hermetic CAD kernel suite only (e21 needs gitignored
          # LLM-regenerated benchmark runs — see the certify job note)
          python -m pytest tests/test_r380_cad_pipeline.py -q
      - name: Webapp build check (R401-WC2 — the fast tier is where UI
          changes land)
        run: |
          set -e
          cd TOSCANINI_UI/webapp
          npm ci --no-audit --no-fund
          NEXT_OUTPUT=export npm run build
          node verify-export.mjs
      - name: Tier summary
        if: always()
        run: |
          echo "## R399 W4 FAST tier" >> $GITHUB_STEP_SUMMARY
          echo "Non-engine code path: secret scan + epistemic core suites." >> $GITHUB_STEP_SUMMARY
          echo "This is a fast check, NOT a detached certification (Art. XXVI)." >> $GITHUB_STEP_SUMMARY
